version: "2"
linters:
  default: standard
  enable:
    - gosec
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (*text/tabwriter.Writer).Flush
    gosec:
      excludes:
        - G204 # subprocess launched with variable: the catalog is the whole point; invariants test guards it
        - G304 # file read by variable path: config, fixtures and --identity are user-supplied paths by design
        - G704 # SSRF: dialing an operator-named host is the ssh transport's purpose
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, unparam]
formatters:
  enable:
    - gofmt
    - goimports
