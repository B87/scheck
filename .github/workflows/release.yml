name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (never moves a tag)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Manual runs must use the selected tag for checks too, not the dispatch branch.
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, clean checkout and absent release
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py preflight "$TAG" "$GITHUB_REPOSITORY"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: make check
      - name: Reject modernization or dependency changes
        if: always()
        run: git diff --exit-code HEAD
      - run: python3 -m unittest discover -s scripts -p 'test_release.py' -v
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
      - run: docker info
      - run: make integ

  draft:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck before creating draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py preflight "$TAG" "$GITHUB_REPOSITORY"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --fail-fast
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}

  smoke:
    needs: [validate, draft]
    # A draft release is invisible to a token without push access: the
    # get-release-by-tag API excludes drafts, and listing them requires
    # write. `contents: read` therefore fails with "release not found"
    # rather than a permission error, which is how the v0.0.1-rehearsal.1
    # rehearsal failed on all four runners. This job downloads and verifies;
    # it never creates, edits or publishes a release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Download draft assets and verify on native runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-assets"
          python3 scripts/release.py smoke "$TAG" "$RUNNER_TEMP/release-assets"
      - name: Record outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
          COMMIT: ${{ needs.validate.outputs.commit }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          printf '### %s: %s\n\nTag: `%s` · Commit: `%s`\n' "$RUNNER_LABEL" "$RESULT" "$TAG" "$COMMIT" >> "$GITHUB_STEP_SUMMARY"

  review:
    needs: [validate, draft, smoke]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'All four downloaded artifacts passed native smoke checks. Release remains a draft; complete docs/RELEASING.md before manual publication.' >> "$GITHUB_STEP_SUMMARY"
