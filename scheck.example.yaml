# scheck.example.yaml — every knob, annotated. Copy to `scheck.yaml` and delete
# what you do not need; an empty file is a valid configuration.
#
# Three things live here, and it helps to keep them apart (docs/CONFIGURATION.md):
#
#   preferences   which profile, where runs are stored        never widen anything
#   restrictions  checks to skip, paths to deny, redactions   every entry narrows
#   context       what the host is for                        grades findings, runs nothing
#
# Nothing in this file can add a command, widen a path, reveal a redacted value or
# make scheck write to the target (docs/SPEC.md §9). Credentials are never read
# from a file: they come from the environment at run time.
#
# File chain, lowest precedence first (docs/SPEC.md §9):
#   1. ~/.config/scheck/config.yaml  (Linux; XDG_CONFIG_HOME)
#      ~/Library/Application Support/scheck/config.yaml  (macOS)
#   2. ./scheck.yaml                 (this file, committed with the repository)
#   3. flags                         (only when actually passed)
# Scalars: the later source wins, per key. Lists: unioned, because they can only
# narrow. An unknown top-level key is an error, not a warning — a typo never
# silently leaves a check enabled.
#
# Check it with:  scheck config validate  &&  scheck config show

# --- preferences ------------------------------------------------------------

# Which tier of the catalog runs. `hardened` adds the on-demand checks.
profile: baseline          # baseline | hardened

# How privileged checks are attempted. `sudo` means `sudo -n --` as a prefix and
# nothing else: scheck never prompts for, reads or transmits a password
# (docs/SPEC.md §4). Without authorized non-interactive sudo, elevated checks are
# reported `unavailable` — a result, not an error. `scheck sudoers` generates the
# matching NOPASSWD fragment.
elevate: none              # none | sudo

# Where run envelopes are persisted. `--no-persist` skips the copy entirely.
# state_dir: ~/.local/state/scheck

# --- restrictions: these only ever narrow ------------------------------------

# Skip catalog checks by id. An unknown id is a usage error (exit 3), so a typo
# cannot look like a disabled check; `scheck catalog` lists the ids for a platform.
# A disabled check does not make its posture rules pass. They report
# `not_assessed` with the reason `check-disabled-by-config`, assessment coverage
# drops, and the exit code can fall to 0 with that ground never looked at —
# unknown is never read as safe (docs/SPEC.md §7.5). Read the coverage, not the
# exit code.
disable_checks:
  - fs.suid                # the vendor image ships SUID helpers we have reviewed
  # - fw.global            # macOS: fw.app_firewall_disabled then reports
                           #   not_assessed, never "pass"

# Refuse to read these paths, on top of the built-in policy. Each entry is a
# literal absolute prefix — `/etc/corp-secrets` denies that file and everything
# under it. No wildcards: `/home/*/.aws` matches a directory actually named `*`,
# not every user's. A relative entry, or `/`, is ignored. Matching happens after
# the path is resolved on the target, so a symlink into a denied tree is denied
# too (docs/SPEC.md §4.3). This list only adds denials; nothing in this file can
# allow a path the compiled-in policy refuses.
deny_paths:
  - /etc/corp-secrets
  - /srv/backups

# Extra redaction patterns (RE2), applied on top of the built-in rules and before
# truncation. A match is replaced with `[REDACTED:<rule>:<n bytes>]` everywhere —
# report, audit log, persisted run, verbose output. Nothing downstream ever sees
# the pre-redaction bytes (docs/SPEC.md §4.4). An invalid pattern fails at load.
redact_extra:
  - "internal\\.example\\.com"
  - "AKIA[0-9A-Z]{16}"

# --- named SSH targets -------------------------------------------------------

# `scheck ssh bastion` instead of `scheck ssh ops@10.0.0.5 -i ~/.ssh/ops`.
# SSH uses strict host-key verification and key or agent authentication; there is
# no password field and no way to add one. `port` defaults to 22.
targets:
  bastion:
    host: 10.0.0.5
    user: ops
    identity: ~/.ssh/ops
  gateway: { host: gw.example.com, user: admin, port: 2222 }

# --- operator context --------------------------------------------------------

# Context says what the host is for, so findings are graded for that host rather
# than for a generic machine (docs/SPEC.md §6.2, §6.3). It changes severities and
# attributes every change; it never changes what scheck executes.
#
# A block here applies to every run from this directory, which is right for a
# single-purpose repository and wrong for a fleet. For per-host context use
# `--context hosts/gateway.yaml`, or drop files in `./.scheck/context/` (*.md,
# *.txt, *.yaml — read implicitly, in lexical order). A later source replaces this
# block whole; across --context sources the merge is per kind (docs/SPEC.md §6.1).
context:
  role: "public API gateway"
  exposure: internet       # internet | vpn | lan | airgapped
  environment: prod        # prod | staging | dev
  owner: platform-team
  data_classification: "customer PII"
  compliance: [soc2]

  # A listener that matches an entry grades down to info; an undeclared one is
  # escalated a step; a declared service that is not listening is its own finding
  # (svc.expected_missing). `proto` defaults to tcp. Deduplicated by port/proto.
  expected_services:
    - { port: 443, proto: tcp, purpose: "nginx public TLS", audience: internet }
    - { port: 5432, proto: tcp, purpose: "postgres", audience: vpc-only }
    - { port: 123, proto: udp, purpose: "chrony" }

  # An accepted risk is still collected and still reported, with
  # `status: accepted`, and is excluded from the exit code. `id` must be a catalog
  # finding id (`scheck explain ID`) or start with `custom:`; a typo is an error at
  # load, not a silently un-accepted risk. Once `expires` (YYYY-MM-DD) has passed
  # the acceptance suppresses nothing and raises risk.acceptance_expired.
  accepted_risks:
    - id: sshd.password_auth_enabled
      reason: "break-glass path; MFA enforced at the bastion"
      expires: 2026-12-31
    - id: "custom:legacy-tls-terminator"
      reason: "decommissioned with the 0.0.2 rollout"
      expires: 2026-11-30

  # Any other key is carried as prose and shown by `--stop-after context`.
  notes: |
    Rebuilt from the golden image on every deploy; local changes are not persisted.

# --- model settings: not used by a host assessment in this build --------------

# No model assesses a host here (docs/SPEC.md §2.1). The live evaluation failed the
# criteria frozen before it was built, and the criteria called that a deletion, so
# `scheck local` and `scheck ssh` collect facts and assess them with the posture
# rules — no API key is read and nothing a check observed leaves the machine.
#
# These keys configure `scheck providers` and the project's evaluation harness
# only. They are parsed, shown by `config show` and cannot fail a run, so a file
# written for a build that reinstates a model pass keeps working. The equivalent
# flags on `local` and `ssh` exit 3 rather than pretending.
#
# provider: openai-compatible   # openai-compatible | mock (anthropic, ollama: post-v1)
# model: gpt-5.6-terra          # default gpt-5.6-luna on OpenAI's endpoint
# base_url: https://api.example.com/v1
# effort: high                  # low | medium | high | max
# max_context: 128000           # declare the window when the adapter cannot know it
#
# The key itself is read from OPENAI_API_KEY at request time. There is no
# configuration key for it, and there will not be one.
