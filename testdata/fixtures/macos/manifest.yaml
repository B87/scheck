platform: macos
execs:
    - argv:
        - id
        - -u
      stdout_file: 001-id.stdout
      code: 0
    - argv:
        - dscl
        - .
        - -read
        - /Groups/admin
        - GroupMembership
      stdout_file: 002-dscl.stdout
      code: 0
    - argv:
        - dscl
        - .
        - -list
        - /Users
        - UniqueID
      stdout_file: 003-dscl.stdout
      code: 0
    - argv:
        - fdesetup
        - status
      stdout_file: 004-fdesetup.stdout
      code: 0
    - argv:
        - find
        - /usr/local
        - /opt
        - -xdev
        - -maxdepth
        - "4"
        - -type
        - f
        - -perm
        - "-4000"
      code: 0
    - argv:
        - find
        - /usr/local
        - /opt
        - /etc
        - /Library/LaunchDaemons
        - /Library/LaunchAgents
        - -xdev
        - -maxdepth
        - "4"
        - -perm
        - "-0002"
        - -not
        - -perm
        - "-1000"
        - -not
        - -type
        - l
      code: 0
    - argv:
        - /usr/libexec/ApplicationFirewall/socketfilterfw
        - --getblockall
      stdout_file: 007-socketfilterfw.stdout
      code: 0
    - argv:
        - /usr/libexec/ApplicationFirewall/socketfilterfw
        - --getglobalstate
      stdout_file: 008-socketfilterfw.stdout
      code: 0
    - argv:
        - /usr/libexec/ApplicationFirewall/socketfilterfw
        - --getstealthmode
      stdout_file: 009-socketfilterfw.stdout
      code: 0
    - argv:
        - uname
        - -n
      stdout_file: 010-uname.stdout
      code: 0
    - argv:
        - ioreg
        - -rd1
        - -c
        - IOPlatformExpertDevice
      stdout_file: 011-ioreg.stdout
      code: 0
    - argv:
        - csrutil
        - status
      stdout_file: 012-csrutil.stdout
      code: 0
    - argv:
        - spctl
        - --status
      stdout_file: 013-spctl.stdout
      code: 0
    - argv:
        - lsof
        - -nP
        - -iTCP
        - -sTCP:LISTEN
      stdout_file: 014-lsof.stdout
      code: 0
    - argv:
        - sw_vers
      stdout_file: 015-sw_vers.stdout
      code: 0
    - argv:
        - find
        - /Library/LaunchDaemons
        - /Library/LaunchAgents
        - -maxdepth
        - "1"
        - -type
        - f
      stdout_file: 016-find.stdout
      code: 0
    - argv:
        - launchctl
        - list
      stdout_file: 017-launchctl.stdout
      code: 0
    - argv:
        - softwareupdate
        - -l
        - --no-scan
      stdout_file: 018-softwareupdate.stdout
      code: 0
    - argv:
        - launchctl
        - print-disabled
        - system
      stdout_file: 019-launchctl.stdout
      code: 0
    - argv:
        - uname
        - -s
      stdout_file: 020-uname.stdout
      code: 0
    - argv:
        - printenv
        - SHELL
      stdout_file: 021-printenv.stdout
      code: 0
    - argv:
        - id
        - -u
      stdout_file: 022-id.stdout
      code: 0
    - argv:
        - uname
        - -a
      stdout_file: 023-uname.stdout
      code: 0
