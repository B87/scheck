base: ../../../fixtures/ubuntu
execs:
# Fixture note (2026-09-20): the fixture target answers with the first matching
# argv, so a case must not record the same argv twice; the shared "ufw active"
# preamble once shadowed this case's own ufw entry (docs/eval/phase2-results.md).
- argv:
  - timedatectl
  - show
  stdout: 'Timezone=Etc/UTC

    LocalRTC=no

    CanNTP=yes

    NTP=yes

    NTPSynchronized=yes

    '
  code: 0
- argv:
  - systemctl
  - is-active
  - auditd
  stdout: 'active

    '
  code: 0
- argv:
  - apt
  - list
  - --upgradable
  stdout: 'Listing...

    '
  code: 0
- argv:
  - which
  - ufw
  stdout: ''
  code: 1
- argv:
  - sudo
  - -n
  - --
  - ufw
  - status
  - verbose
  absent: true
