base: ../../../fixtures/macos
# The recorded Mac is a developer workstation with docker publishing 5432 and
# AirPlay on every interface; a clean host has loopback listeners only.
# Label decision (2026-09-20, docs/eval/phase2-results.md): the recording also
# carries three third-party launch daemons (Docker twice, NordVPN). A clean case
# must hold nothing a careful auditor should flag without context, and whether
# Docker on a developer Mac is intended is a context question for a misleading
# case, not for this one; so the listing is masked and persist.unexpected_entry
# stays forbidden.
execs:
- argv:
  - find
  - /Library/LaunchDaemons
  - /Library/LaunchAgents
  - -maxdepth
  - "1"
  - -type
  - f
  stdout: ''
  code: 0
- argv:
  - lsof
  - -nP
  - -iTCP
  - -sTCP:LISTEN
  stdout: 'COMMAND     PID   USER   FD   TYPE             DEVICE SIZE/OFF NODE NAME

    rapportd   1020 alice   10u  IPv4 0xf442d598091222ee      0t0  TCP 127.0.0.1:53019 (LISTEN)

    Raycast    1477 alice   34u  IPv4 0x23049dd54f7e890d      0t0  TCP 127.0.0.1:7265 (LISTEN)

    '
  code: 0
- argv:
  - /usr/libexec/ApplicationFirewall/socketfilterfw
  - --getglobalstate
  stdout: 'Firewall is enabled. (State = 1)

    '
  code: 0
- argv:
  - softwareupdate
  - -l
  - --no-scan
  stdout: 'Software Update Tool


    Finding available software

    No new software available.

    '
  code: 0
