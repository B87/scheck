# =============================================================================
#  domain.yaml: domain, mail DNS and one site
# =============================================================================
#
#  The other surfaces are in docs/examples/README.md.
#
#  WHAT THIS CHECKS
#  ----------------
#  No credential. For each domain root scheck reads, through the gate:
#
#    * mail DNS: SPF, DMARC, MX, and DKIM at each selector listed under
#      mail.senders. DNS cannot list selectors, so a sender with none is
#      insufficient evidence for DKIM, not "DKIM is missing".
#    * a domain under mail.no_mail, which must publish SPF `v=spf1 -all` and
#      DMARC `p=reject`.
#    * NS, and the names MX and NS point at. Those names are recorded and
#      not contacted.
#    * the front page of each name it reads, over https and http. The https
#      read is that name's one TLS handshake.
#
#  A url root is a declared site. On it, scheck also reads entry points from
#  intent, /robots.txt, /.well-known/security.txt, and one redirect hop on
#  the same host. Header, cookie and plain-HTTP rules apply to a declared
#  site. It does not log in, crawl, or try to claim a name.
#
#  HOW TO READ THE RESULT
#  ----------------------
#    email    email.dmarc_not_enforced, email.spf_missing,
#             email.spf_permits_anyone, email.spf_undeclared_sender,
#             email.dkim_missing, email.no_mail_spoofable on a no_mail domain.
#    dns      dns.takeover_candidate, dns.dangling_external. A name that
#             matches the wildcard is one finding, on `*.<root>`.
#    web      on the url root: web.hsts_missing, web.plaintext_http,
#             web.security_headers, web.session_cookie_flags,
#             tls.certificate_invalid.
#    reach    web.restricted_reachable when a not_exposed URL answers from a
#             vantage outside its audience. Pass the vantage this run has:
#             --vantage internet|vpn|lan. With not_exposed set and no
#             vantage, the report warns; it does not invent where you sit.
#    exit     1 = findings, 2 = a limit or a failed read cut the run short.
#
#  RUN
#  ---
#  Replace yourlab.example and yourlab.net with domains you are authorized
#  to assess. A run queries DNS and fetches front pages.
#
#    scheck run docs/examples/domain.yaml --stop-after intake
#    scheck run docs/examples/domain.yaml --vantage internet
#    scheck run docs/examples/domain.yaml --vantage internet -v
#    scheck run docs/examples/domain.yaml --vantage internet --format json
# =============================================================================

schema: 1
engagement:
  name: domain-lab
  operator: yourname
  timezone: Europe/Madrid
  trigger: routine

roots:
  - domain: yourlab.example
  - domain: yourlab.net                 # owned, sends no mail
  - url: https://yourlab.example/       # a declared site; header and cookie rules

# exclude:
#   - url: https://yourlab.example/checkout/

mail:
  senders:
    # DKIM is read only at the selectors named here.
    - {domain: yourlab.example, service: google-workspace, dkim_selectors: [google]}
  no_mail: [yourlab.net]

# A url under a domain root is an entry point, not a new root of scope.
intent:
  exposed_on_purpose:
    - {url: https://yourlab.example/status, audience: internet, reason: "the uptime vendor reads it"}
  not_exposed:
    - {url: https://yourlab.example/admin, audience: vpn}

assets:
  site:
    url: https://yourlab.example/
    # When the name points at a host you do not operate, confirm it by hand.
    # 0.0.2 does not ask; the Scope stage does from 0.0.3.
    # first_party: {confirmed_by: you, date: 2026-10-12, target: shops.example.net}
    # confirmed_by is a people handle, so people: has to name that person.
